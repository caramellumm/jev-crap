[project]
name = "jev-crap"
version = "0.2.0"
description = "Avalia qualidade de código função a função, cruzando métrica contável com julgamento do modelo Jev"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Duarte Ferreira" }]
keywords = [
    "mcp",
    "qualidade-de-codigo",
    "complexidade-ciclomatica",
    "cobertura",
    "crap",
    "lizard",
    "lcov",
    "typesafe",
    "jev",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

# Três dependências e nenhuma a mais, por decisão de arquitetura:
# - fastmcp: o protocolo MCP, única forma de um agente falar com a ferramenta.
#   O piso é 4.0 porque o servidor usa `annotations` em @tool, `ToolError` e o
#   Client em memória para teste — API que não existia na linha 2.x.
# - lizard: complexidade ciclomática em 27 linguagens. A alternativa (radon) dá
#   o mesmo número em Python e só entende Python — multilinguagem sai de graça
#   trocando uma pela outra.
# - httpx: as chamadas ao Jev.
# A cobertura é lida de LCOV e Cobertura XML com a biblioteca padrão: depender
# de coverage.py amarraria a ferramenta a projetos Python, que é exatamente o
# contrário do que lizard permite.
# pydantic não aparece aqui de propósito: ele já vem com o fastmcp, e declarar
# duas vezes a mesma dependência cria a chance de pinar versões incompatíveis.
dependencies = [
    "httpx>=0.27",
    "lizard>=1.17",
    "fastmcp>=4.0",
]

# O executável aponta para a camada de CLI, não para o servidor direto: quem
# roda `uvx --from jev-crap jev-crap --help` precisa receber ajuda, não um
# processo stdio parado esperando uma mensagem MCP que nunca chega. O servidor
# tem entrada própria (`jev-crap-mcp`), que é a que o cliente MCP invoca.
[project.scripts]
jev-crap = "jev_crap.cli:principal"
jev-crap-mcp = "jev_crap.server:main"

[project.optional-dependencies]
# pytest-cov está aqui porque esta ferramenta LÊ relatório de cobertura: sem
# gerar um, não há como rodá-la sobre si mesma, e uma ferramenta de qualidade
# que nunca se mediu é a definição de não estar usando o próprio conselho.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_crap"]
# Dados do pacote (julgamento/perguntas.json) entram sozinhos por morarem
# dentro do diretório; o que não pode entrar é lixo de execução.
exclude = ["**/__pycache__", "**/*.py[cod]"]

[tool.hatch.build.targets.sdist]
# O sdist leva testes, fixtures e a skill de propósito: quem empacota a
# ferramenta para uma distribuição precisa poder rodar a suíte a partir do
# tarball, e a skill é parte da entrega tanto quanto o servidor.
include = [
    "src/jev_crap",
    "tests",
    "skills",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = ["**/__pycache__", "**/*.py[cod]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# O padrão do pytest é `test*`, que numa base em português coleta como teste
# qualquer função chamada `testes_de`, `testar_x` ou `teste_verifica`. Exigir o
# sublinhado separa a convenção do pytest do vocabulário do domínio.
python_functions = ["test_*"]
# O teste do servidor conversa com ele por um Client em memória, que é async.
# `asyncio_mode = "auto"` evita ter que decorar cada teste com @pytest.mark.asyncio.
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:jev_crap.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
